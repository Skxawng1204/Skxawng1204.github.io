/* Rescue Engine — thiết kế tối giản, ưu tiên quyết định */
.sr-shell{max-width:1080px;margin:auto;display:grid;gap:18px}
.sr-lotbar{background:#fff;border:1px solid var(--line);border-radius:17px;padding:21px 25px;display:flex;align-items:center;justify-content:space-between;gap:15px}
.sr-steps{font-size:10px;font-weight:850;letter-spacing:1.2px;color:#698878;text-transform:uppercase;margin:0 0 7px}
.sr-lotbar h2{font-size:21px;letter-spacing:-.5px;margin:0 0 5px}.sr-lotbar p{color:#708778;font-size:12px;margin:0}
.sr-selectbox{min-width:290px;max-width:390px;flex:0 0 37%}.sr-selectbox label{display:block;font-size:11px;color:#718c7e;font-weight:700;margin-bottom:7px}
.sr-selectbox select{width:100%;border:1px solid #dde7e0;background:#fafffb;border-radius:11px;padding:12px;color:var(--ink);font-size:13px;font-weight:700}
.sr-risk{border:1px solid #f2dfbd;background:#fffaf1;border-radius:17px;padding:23px 27px;display:flex;align-items:center;gap:25px}
.sr-risk.good{background:#f2faf5;border-color:#d6ebdd}.sr-risk.hold{background:#fff3f1;border-color:#f6d9d4}
.sr-riskmain{flex:1;min-width:0}.sr-riskmain h3{font-size:20px;letter-spacing:-.55px;margin:3px 0 8px;line-height:1.35}.sr-riskmain p{margin:0;font-size:13px;line-height:1.65;color:#786d52;max-width:625px}.sr-risk.good p{color:#587864}.sr-risk.hold p{color:#8e605c}
.sr-riskfigure{flex:0 0 auto;min-width:152px;text-align:right;border-left:1px solid #e9dbbf;padding-left:22px}.sr-riskfigure strong{display:block;font-size:38px;font-weight:850;letter-spacing:-1.7px;line-height:1.1;color:#a46b25}.sr-riskfigure span{font-size:11px;color:#89775a;font-weight:650}.sr-risk.good .sr-riskfigure strong{color:#377953}
.sr-decision{border:1px solid #dceae1;background:white;border-radius:18px;box-shadow:0 10px 40px rgba(21,70,45,.045);overflow:hidden}

 {id:'melon',name:'Dưa lưới',emoji:'🍈',elasticity:1.65,appReach:1.55,comboReach:1.26,transferMin:2.5,transferKg:3200,note:'Kiểm tra nứt, dập, mùi và cuống theo giống; điều kiện bảo quản và độ chín ảnh hưởng thời gian bán.'},

 {id:'FF-304',category:'mango',fruit:'Xoài cát',qty:64,velocity:14,days:2,price:56000,cost:36000,quality:'Đạt',ripeness:'Chín ăn ngay',received:daysAgo(3),target:1.65,trend:[12,16,13,15,14,13,14]},
 {id:'FF-305',category:'banana',fruit:'Chuối già',qty:82,velocity:18,days:1.5,price:27000,cost:17000,quality:'Đạt',ripeness:'Chín ăn ngay',received:daysAgo(3),target:1.85,trend:[22,19,21,17,20,18,18]},
 {id:'FF-306',category:'watermelon',fruit:'Dưa hấu đỏ nguyên quả',qty:134,velocity:31,days:3,price:18000,cost:11000,quality:'Đạt',ripeness:'Không áp dụng',received:daysAgo(1),target:1.45,trend:[29,34,31,30,29,33,31]},
 {id:'FF-307',category:'kiwi',fruit:'Kiwi xanh',qty:42,velocity:7,days:5,price:125000,cost:90000,quality:'Cần kiểm tra',ripeness:'Chín vừa',received:daysAgo(2),target:1.3,trend:[6,8,7,6,7,8,7]},
 {id:'FF-308',category:'apple',fruit:'Táo Fuji',qty:110,velocity:24,days:5,price:69000,cost:47000,quality:'Đạt',ripeness:'Không áp dụng',received:daysAgo(2),target:1.4,trend:[20,24,21,28,22,26,24]},
 {id:'FF-309',category:'pear',fruit:'Lê Hàn Quốc',qty:72,velocity:13,days:4,price:78000,cost:54000,quality:'Đạt',ripeness:'Chín vừa',received:daysAgo(2),target:1.5,trend:[11,13,12,14,11,15,13]},
 {id:'FF-310',category:'melon',fruit:'Dưa lưới ruột cam',qty:51,velocity:9,days:2,price:63000,cost:43000,quality:'Đạt',ripeness:'Chín ăn ngay',received:daysAgo(2),target:1.8,trend:[8,10,9,11,8,9,8]},
 {id:'FF-311',category:'other',fruit:'Thanh long (minh họa)',qty:120,velocity:33,days:4,price:29000,cost:16000,quality:'Đạt',ripeness:'Không áp dụng',received:daysAgo(1),target:1.6,trend:[32,29,34,30,35,33,33]}
].map(l=>({...l,emoji:categoryOf(l).emoji,store:'Cửa hàng demo'}));
const STORE_KEY='freshflow_bhx_9nhom_v3';
const clone=a=>JSON.parse(JSON.stringify(a));
const fromStorage=()=>{try{const v=JSON.parse(localStorage.getItem(STORE_KEY));return v&&Array.isArray(v.lots)&&Array.isArray(v.actions)?v:null}catch(e){return null}};
const stored=fromStorage();
let lots=stored?stored.lots:clone(SEED),actions=stored?stored.actions:[];
let selectedId='FF-305',selectedStrategy=null,view='overview',searchTerm='',filter='all',categoryFilter='all';
let compareOpen=false,advancedOpen=false;
let factors={demand:100,maxDiscount:25,minMargin:8,objective:'balance',daysOverride:null};
const labels={overview:'Tổng quan',engine:'Rescue Engine',inventory:'Lô trái cây',actions:'Hành động xử lý'};
const objLabel={profit:'Tối đa lãi',balance:'Cân bằng',waste:'Giảm hàng hủy'};
const STRATEGIES=[
 {id:'keep',name:'Giữ nguyên giá',sub:'Bán theo tốc độ hiện tại',discount:0,reach:1},
 {id:'off10',name:'Giảm giá 10%',sub:'Tem ưu đãi tại quầy',discount:.10,reach:1},
 {id:'off20',name:'Giảm giá 20%',sub:'Tem ưu đãi tại quầy',discount:.20,reach:1},
 {id:'off30',name:'Giảm giá 30%',sub:'Tem ưu đãi tại quầy',discount:.30,reach:1},
 {id:'combo',name:'Bán combo trái cây',sub:'Chiết khấu tương đương 12%',discount:.12,reach:1.34,variable:900},
 {id:'app',name:'Đẩy voucher lên app',sub:'Voucher 12% + tăng độ phủ',discount:.12,reach:1.55,fixed:50000},
 {id:'transfer',name:'Chuyển sang cửa hàng B',sub:'Chuyển 50% lô; mất 0,35 ngày',discount:0,reach:1}
];
const dNum=n=>new Intl.NumberFormat('vi-VN',{maximumFractionDigits:1}).format(n);
const money=n=>(n<0?'-':'')+new Intl.NumberFormat('vi-VN',{maximumFractionDigits:0}).format(Math.abs(Math.round(n)))+'đ';
const moneyShort=n=>{const x=Math.abs(n);return (n<0?'-':'')+(x>=1000000?(x/1000000).toFixed(2).replace('.',',')+'tr':x>=1000?Math.round(x/1000)+'k':Math.round(x)+'đ')};
const percent=n=>Math.round(n*100)+'%';
const escapeHtml=s=>String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;');
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify({lots,actions}))}catch(e){}}
function getLot(){return lots.find(x=>x.id===selectedId)||lots[0]||null}
function safeQty(n){return Number.isFinite(n)?Math.max(0,n):0}
function originalRisk(l){return Math.max(0,l.qty-l.velocity*l.days)}
function riskClass(l){if(l.quality!=='Đạt')return 'hold';const waste=originalRisk(l),portion=l.qty>0?waste/l.qty:0;if(portion>.40||l.days<=1)return 'critical';if(portion>.13||l.days<=2)return 'risk';return 'ok'}
function riskTag(l){let c=riskClass(l);return c==='hold'?(l.quality==='Không đạt'?'<span class="tag tag-critical">⛔ Không được bán</span>':'<span class="tag tag-hold">⏸ Chờ kiểm tra</span>'):c==='critical'?'<span class="tag tag-critical">● Ưu tiên cao</span>':c==='risk'?'<span class="tag tag-risk">● Có nguy cơ</span>':'<span class="tag tag-ok">● Đang ổn</span>'}
function demandMult(discount,elasticity,reach){return Math.pow(1/Math.max(.05,1-discount),elasticity)*reach}
function optimize(l,override=false){
 let horizon=override&&factors.daysOverride!==null?Number(factors.daysOverride):l.days;
 let demand=override?factors.demand/100:1;
 const cat=categoryOf(l),e=cat.elasticity,disposal=1500,qty=l.qty,rate=l.velocity*demand,fullCost=qty*l.cost;
 let outcomes=STRATEGIES.map(s=>{
   let allowed=l.quality==='Đạt'&&horizon>0&&s.discount*100<= (override?factors.maxDiscount:25) &&(l.price*(1-s.discount)>=l.cost*(1+(override?factors.minMargin:8)/100));
   let sold=0,fixed=s.fixed||0,variable=0,reason='';
   if(s.id==='transfer'){
     if(horizon<cat.transferMin)allowed=false;
     let moved=qty*.5,remaining=qty-moved;
     const localSold=Math.min(remaining,rate*horizon);
     const targetSold=Math.min(moved,rate*l.target*Math.max(0,horizon-.35));
     sold=localSold+targetSold;
     variable=moved*cat.transferKg;
     fixed=35000;
     reason=horizon<cat.transferMin?`Không ưu tiên chuyển nhóm ${cat.name.toLowerCase()} khi thời gian bán còn dưới ${cat.transferMin} ngày.`:'Cần xác nhận tồn kho, năng lực cửa hàng nhận và điều kiện vận chuyển.';
   }else{
     const categoryReach=s.id==='app'?cat.appReach:s.id==='combo'?cat.comboReach:1;
     sold=Math.min(qty,rate*horizon*demandMult(s.discount,e,categoryReach));
     variable=sold*(s.variable||0);
   }
   if(s.id==='combo')reason='Chỉ tính doanh thu phần trái cây; chưa tính lợi nhuận sản phẩm ghép.';
   if(s.id==='app')reason='Chi phí chiến dịch giả định 50.000đ/lô.';
   if(s.id==='keep')reason='Không phát sinh chi phí triển khai.';
   if(s.discount>0&&l.price*(1-s.discount)<l.cost*(1+(override?factors.minMargin:8)/100))reason='Không đạt ngưỡng biên lợi nhuận tối thiểu.';
   if(s.discount*100>(override?factors.maxDiscount:25))reason='Vượt trần mức giảm giá.';
   if(l.quality!=='Đạt')reason='Phải kiểm tra chất lượng trước khi được phép bán.';
   const waste=safeQty(qty-sold),revenue=sold*l.price*(1-s.discount),ops=fixed+variable,net=revenue-fullCost-ops-waste*disposal;
   return {...s,allowed,sold,waste,revenue,ops,net,horizon,reason};
 });
 const base=outcomes.find(x=>x.id==='keep');
 outcomes=outcomes.map(o=>({...o,delta:o.net-base.net,rescued:base.waste-o.waste,rate:qty>0?o.sold/qty:0,score:o.net-o.waste*(override?(factors.objective==='profit'?0:factors.objective==='balance'?6000:18000):6000)}));
 const ranked=outcomes.filter(x=>x.allowed).sort((a,b)=>b.score-a.score);
 return {outcomes,base,best:ranked[0]||null,days:horizon};
}
function totals(){const qty=lots.reduce((a,l)=>a+l.qty,0);let projectedWaste=0,avoided=0,valueAtRisk=0,critical=0;for(const l of lots){if(l.quality!=='Đạt'){critical++;continue}const result=optimize(l);projectedWaste+=result.base.waste;avoided+=Math.max(0,result.base.waste-(result.best?.waste??result.base.waste));valueAtRisk+=result.base.waste*l.cost;if(riskClass(l)==='critical'||riskClass(l)==='risk')critical++}return {qty,projectedWaste,avoided,valueAtRisk,critical};}

function inventoryTable(items,canFilter=false){if(!items.length)return '<div class="empty">Không tìm thấy lô hàng phù hợp.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>MẶT HÀNG / MÃ LÔ</th><th>TỒN KHO</th><th>BÁN / NGÀY</th><th>THỜI GIAN CÒN</th><th>NGUY CƠ DƯ</th><th>TRẠNG THÁI</th><th></th></tr></thead><tbody>${items.map(l=>`<tr><td>${fruitName(l)}</td><td><strong>${dNum(l.qty)} kg</strong></td><td>${dNum(l.velocity)} kg</td><td>${dNum(l.days)} ngày</td><td><b style="color:${originalRisk(l)>0?'#b96d36':'#218257'}">${dNum(originalRisk(l))} kg</b></td><td>${riskTag(l)}</td><td style="white-space:nowrap"><button class="btn btn-sm" data-open-lot="${escapeHtml(l.id)}">Phân tích ↗</button>${l.quality!=='Đạt'?` <button class="btn btn-sm" data-verify-lot="${escapeHtml(l.id)}">Kiểm định</button>`:''}</td></tr>`).join('')}</tbody></table></div>`}
function renderOverview(){const t=totals();let risky=[...lots].filter(l=>riskClass(l)!=='ok').sort((a,b)=>(originalRisk(b)*b.cost)-(originalRisk(a)*a.cost));let sorted=[...lots].filter(l=>l.quality==='Đạt').sort((a,b)=>originalRisk(b)-originalRisk(a)).slice(0,5);let max=Math.max(1,...sorted.map(l=>originalRisk(l)));const highlights=risky.filter(l=>l.quality==='Đạt');const top=highlights[0];let topEval=top?optimize(top):null;
 document.getElementById('view-overview').innerHTML=`${header('SMART FRUIT INVENTORY','Tổng quan vận hành','Danh mục khảo sát thực tế: 9 nhóm · Toàn bộ tồn kho/giá bán là dữ liệu giả lập',`<button class="btn" id="exportDashboard">↓ Xuất báo cáo CSV</button><button class="btn btn-primary" data-add-lot>＋ Nhập lô mới</button>`)}
 <div class="hero"><div><div class="hero-eyebrow">✦ 9 NHÓM TRÁI CÂY · MÔ PHỎNG CỬA HÀNG GẦN TRƯỜNG</div><h2>Đừng đợi trái cây xuống cấp mới tìm cách bán.</h2><p>Ghi theo mã lô và ngày nhập → đánh giá riêng theo loại trái cây → mô phỏng 7 hành động cứu hàng.</p><button class="btn btn-mint" data-nav="engine">Mở Rescue Engine <span>↗</span></button></div><div class="hero-art">🥭</div></div>
 <div class="category-strip"><span class="category-title">Danh mục đã khảo sát</span>${CATEGORIES.map(c=>`<button class="category-chip" data-category-nav="${c.id}">${c.emoji} ${c.name}</button>`).join('')}</div>
 <div class="kpi-grid">
   <div class="card kpi"><div class="kpi-top"><span class="kpi-label">Tổng tồn kho</span><span class="kpi-icon">▣</span></div><div class="kpi-val">${dNum(t.qty)} <span style="font-size:15px;color:#91a598;font-weight:600">kg</span></div><div class="kpi-foot">${lots.length} lô · ${new Set(lots.map(l=>l.category)).size}/9 nhóm trái cây</div></div>
   <div class="card kpi kpi-amber"><div class="kpi-top"><span class="kpi-label">Nguy cơ tồn đọng</span><span class="kpi-icon">⚠</span></div><div class="kpi-val">${dNum(t.projectedWaste)} <span style="font-size:15px;color:#91a598;font-weight:600">kg</span></div><div class="kpi-foot">Giả định chưa can thiệp, chỉ lô đạt chất lượng</div></div>
   <div class="card kpi kpi-red"><div class="kpi-top"><span class="kpi-label">Giá vốn hàng có nguy cơ</span><span class="kpi-icon">◈</span></div><div class="kpi-val">${moneyShort(t.valueAtRisk)}</div><div class="kpi-foot">Giá trị ước tính của phần có nguy cơ không bán kịp</div></div>
   <div class="card kpi"><div class="kpi-top"><span class="kpi-label">Có thể cứu thêm (mô phỏng)</span><span class="kpi-icon">↗</span></div><div class="kpi-val">${dNum(t.avoided)} <span style="font-size:15px;color:#91a598;font-weight:600">kg</span></div><div class="kpi-foot"><b>Chênh lệch dự báo</b>, chưa phải kết quả thực tế</div></div>
 </div>
 <div class="dash-grid"><div class="card"><div class="card-head"><div><h3 class="card-title">Lô cần chú ý trước</h3><p class="card-sub">Ưu tiên theo giá trị hàng tồn có nguy cơ</p></div><span class="tag tag-risk">${t.critical} lô cần xử lý</span></div><div class="card-body"><div class="risk-list">${risky.slice(0,5).map(l=>{const w=originalRisk(l);return `<div class="risk-row" data-open-lot="${escapeHtml(l.id)}"><div class="fruit-emoji">${l.emoji}</div><div><div class="risk-name">${escapeHtml(l.fruit)} <span style="font-weight:500;color:#9cae9e;font-size:10px">· ${escapeHtml(l.id)}</span></div><div class="risk-details">Còn ${dNum(l.days)} ngày · Dự báo bán ${dNum(l.velocity)} kg/ngày</div><div class="progress ${w===0?'safe':''}"><span style="width:${Math.min(100,w/l.qty*100)}%"></span></div></div><div class="risk-right">${dNum(w)} kg<small>${l.quality==='Đạt'?'nguy cơ dư':'chờ kiểm tra'}</small></div></div>`}).join('')||'<div class="empty">Chưa có lô nguy cơ.</div>'}</div></div></div>
 <div class="card"><div class="card-head"><div><h3 class="card-title">Ước tính tồn theo mặt hàng</h3><p class="card-sub">Số kg có khả năng bán không kịp</p></div></div><div class="card-body"><div class="mini-bars">${sorted.map(l=>`<div class="mini-bar-row"><label>${l.emoji} ${escapeHtml(l.fruit)}</label><div class="mini-bar-track"><span style="width:${Math.max(1,originalRisk(l)/max*100)}%"></span></div><b>${dNum(originalRisk(l))} kg</b></div>`).join('')}</div></div><div class="insight"><h4>✳ Gợi ý từ Rescue Engine</h4><p>${top&&topEval?.best?`<b>${escapeHtml(top.fruit)} (${escapeHtml(top.id)})</b>: thử <b>${escapeHtml(topEval.best.name.toLowerCase())}</b>. Mô phỏng bán thêm ${dNum(Math.max(0,topEval.best.rescued))} kg so với giữ giá trong thời gian còn phù hợp để bán.`:'Chọn một lô đạt chất lượng để nhận đề xuất phương án phù hợp.'}</p><button class="btn btn-primary btn-sm" data-open-lot="${escapeHtml(top?top.id:lots[0]?.id||'')}">Xem phân tích →</button></div></div></div>
 <div class="card table-card"><div class="card-head"><div><h3 class="card-title">Quản lý lô trái cây</h3><p class="card-sub">Theo dõi mức tồn, tốc độ bán và rủi ro theo từng lô</p></div><button class="btn btn-sm" data-nav="inventory">Xem tất cả →</button></div>${inventoryTable(lots.slice(0,5))}</div><p class="small-note">* Khối lượng “nguy cơ dư” = max(0, tồn kho − tốc độ bán mỗi ngày × số ngày còn bán phù hợp). Đây không phải là dự báo thực tế đã được kiểm chứng.</p>`;
}
function renderEngine(){
 const l=getLot();if(!l){document.getElementById('view-engine').innerHTML='<p>Chưa có lô hàng.</p>';return}
 const e=optimize(l,true),best=e.best;
 const selected=e.outcomes.find(o=>o.id===selectedStrategy&&o.allowed)||best;
 selectedStrategy=selected?.id||null;
 const blocked=l.quality!=='Đạt';
 const risk=e.base.waste,good=risk<=0;
 const riskLabel=blocked?'CẦN KIỂM TRA CHẤT LƯỢNG':good?'ĐANG TRONG TẦM KIỂM SOÁT':'CẢNH BÁO TỒN ĐỌNG';
 const riskTitle=blocked?'Chưa được phép đề xuất bán':good?'Lô này có khả năng bán kịp':'Có nguy cơ không bán hết trước khi xuống cấp';
 const riskBody=blocked?'Nhân viên cần kiểm tra trực tiếp và xác nhận chất lượng. Hệ thống tạm khóa mọi đề xuất bán để bảo đảm an toàn.':good?'Dự báo theo tốc độ bán hiện tại không phát sinh hàng dư. Tiếp tục theo dõi nếu sức mua thay đổi.':`Nếu giữ nguyên cách bán hiện tại, ước tính ${dNum(risk)} kg có thể không bán kịp. Hệ thống đã so sánh các phương án để giảm nguy cơ này.`;
 const explain=o=>{
  if(!o)return 'Không có phương án đáp ứng giới hạn hiện tại. Hãy kiểm tra lại chất lượng và chính sách.';
  if(o.id==='transfer')return 'Chuyển một phần lô sang cửa hàng B có nhu cầu giả định cao hơn; đã tính chi phí và thời gian vận chuyển.';
  if(o.id==='app')return 'Đề xuất ưu đãi trên ứng dụng để tiếp cận thêm khách hàng. Chi phí chiến dịch đã được tính trong mô phỏng.';
  if(o.id==='combo')return 'Ghép trái cây vào combo để tăng lượng bán. Lợi nhuận của sản phẩm đi kèm chưa được tính.';
  if(o.discount>0)return 'Điều chỉnh giá bán để kích cầu nhưng vẫn tuân thủ trần giảm giá và biên lợi nhuận tối thiểu.';
  return 'Tiếp tục bán với giá hiện tại và theo dõi lượng tiêu thụ; chưa cần khuyến mãi thêm.';
 };
 const delta=selected?.delta||0;
 const signedDelta=(delta>0?'+':'')+moneyShort(delta);
 const eligible=e.outcomes.filter(o=>o.allowed).sort((a,b)=>b.score-a.score);
 const options=e.outcomes.map(o=>`<button type="button" class="sr-option ${selected?.id===o.id?'chosen':''}" data-strategy="${o.id}" ${o.allowed?'':'disabled'}><div><span class="sr-option-title">${escapeHtml(o.name)} ${best?.id===o.id?'· ★ Đề xuất':''}</span><small class="sr-option-sub">${escapeHtml(o.allowed?o.sub:(o.reason||'Không đủ điều kiện'))}</small></div><div class="sr-option-values"><div><b>${o.rescued>=0?'+':''}${dNum(o.rescued)} kg</b><small>Bán thêm</small></div><div><b style="color:${o.delta<0?'#b76c22':'#197752'}">${o.delta>0?'+':''}${moneyShort(o.delta)}</b><small>Chênh lệch lãi/lỗ</small></div><div style="font-size:17px;color:#25855a">${selected?.id===o.id?'✓':'○'}</div></div></button>`).join('');
 document.getElementById('view-engine').innerHTML=`${header('TRỢ LÝ QUYẾT ĐỊNH','Rescue Engine','Một lô hàng · Một quyết định rõ ràng. Xem thông tin chi tiết chỉ khi cần.',`<button class="btn" id="exportEngine">↓ Xuất CSV</button><button class="btn btn-primary" data-add-lot>＋ Thêm lô</button>`)}
 <div class="sr-shell">
  <section class="sr-lotbar" aria-label="Chọn lô trái cây"><div><div class="sr-steps">BƯỚC 1 · CHỌN LÔ HÀNG</div><h2>${l.emoji} ${escapeHtml(l.fruit)}</h2><p>${escapeHtml(l.id)} · ${dNum(l.qty)} kg tồn · Còn ${dNum(e.days)} ngày bán phù hợp · ${riskTag(l)}</p></div><div class="sr-selectbox"><label for="lotSelector">Đổi lô trái cây</label><select id="lotSelector">${lots.map(x=>`<option value="${escapeHtml(x.id)}" ${x.id===l.id?'selected':''}>${x.emoji} ${escapeHtml(x.fruit)} · ${escapeHtml(x.id)}</option>`).join('')}</select></div></section>
  <section class="sr-risk ${blocked?'hold':good?'good':''}" aria-label="Cảnh báo tồn đọng"><div class="sr-riskmain"><div class="sr-steps">BƯỚC 2 · ${riskLabel}</div><h3>${riskTitle}</h3><p>${riskBody}</p></div><div class="sr-riskfigure"><strong>${blocked?'—':dNum(risk)+' kg'}</strong><span>${blocked?'Chờ kết quả kiểm tra':'Dự kiến tồn đọng nếu giữ giá'}</span></div></section>
  <section class="sr-decision"><div class="sr-decision-header"><div class="sr-topline">✦ BƯỚC 3 · ${selected&&selected.id!==best?.id?'PHƯƠNG ÁN ĐANG SO SÁNH':'HỆ THỐNG ĐỀ XUẤT'}</div><h2>${blocked?'Kiểm tra chất lượng trước':selected?escapeHtml(selected.name):'Chưa có đề xuất hợp lệ'}</h2><p class="sr-explain">${blocked?'Chỉ khi nhân viên xác nhận lô đạt yêu cầu, hệ thống mới cho phép tạo phiếu xử lý bán hàng.':explain(selected)}</p></div>
  ${selected&&!blocked?`<div class="sr-metrics"><div class="sr-metric"><span>Trái cây bán thêm</span><strong>${selected.rescued>0?'+':''}${dNum(selected.rescued)} kg</strong><small>So với giữ nguyên giá</small></div><div class="sr-metric"><span>Chênh lệch lãi/lỗ</span><strong style="color:${delta<0?'#a86b2e':''}">${signedDelta}</strong><small>So với giữ nguyên giá</small></div><div class="sr-metric"><span>Còn nguy cơ tồn</span><strong>${dNum(selected.waste)} kg</strong><small>Ước tính sau hành động</small></div></div>`:''}
  <div class="sr-cta"><p>${blocked?'Không thể tạo phiếu bán trước khi kiểm tra.':selected&&selected.id!==best?.id?'Đây là phương án m đang xem, không phải đề xuất đứng đầu.':'Đây là khuyến nghị mô phỏng. Quản lý cần kiểm tra điều kiện thực tế trước khi thực hiện.'}</p>${blocked?`<button class="btn btn-primary" data-verify-lot="${escapeHtml(l.id)}">Kiểm tra chất lượng →</button>`:`<button class="btn btn-primary" id="applyStrategy" ${selected?'':'disabled'}>Tạo phiếu xử lý →</button>`}</div>
  </section>
  <section class="sr-more"><button type="button" class="sr-morehead" data-toggle-compare aria-expanded="${compareOpen}"><span class="sr-moreicon">⇄</span><span><strong>So sánh các phương án khác</strong><small>${eligible.length} phương án hợp lệ · Chỉ mở khi cần phân tích sâu</small></span><span class="sr-arrow">${compareOpen?'⌃':'⌄'}</span></button>${compareOpen?`<div class="sr-optionlist">${options}</div>`:''}</section>
  <section class="sr-more"><button type="button" class="sr-morehead" data-toggle-advanced aria-expanded="${advancedOpen}"><span class="sr-moreicon">⚙</span><span><strong>Điều chỉnh giả định & xem cách tính</strong><small>Sức mua · Thời gian bán · Chính sách giá · Mục tiêu tối ưu</small></span><span class="sr-arrow">${advancedOpen?'⌃':'⌄'}</span></button>${advancedOpen?`<div class="sr-settings"><div class="sr-settings-intro">Các thông số dưới đây dùng để thử nghiệm. Không phải dữ liệu vận hành thật của Bách Hóa Xanh.</div><div class="sr-settings-grid"><div class="field"><label>Sức mua dự kiến <output id="demandOutput">${factors.demand}%</output></label><input type="range" id="demandSlider" min="50" max="180" step="5" value="${factors.demand}"/><div class="field-hint">100% = tốc độ bán gần đây.</div></div><div class="field"><label>Ngày còn bán phù hợp <output id="daysOutput">${dNum(e.days)} ngày</output></label><input type="range" id="daysSlider" min="0" max="14" step="0.5" value="${e.days}"/><div class="field-hint">Phải dựa vào kiểm tra chất lượng.</div></div><div class="field"><label>Trần giảm giá</label><select id="discountLimit"><option value="10" ${factors.maxDiscount==10?'selected':''}>10%</option><option value="20" ${factors.maxDiscount==20?'selected':''}>20%</option><option value="25" ${factors.maxDiscount==25?'selected':''}>25%</option><option value="30" ${factors.maxDiscount==30?'selected':''}>30%</option></select></div><div class="field"><label>Biên lợi nhuận tối thiểu</label><select id="marginLimit"><option value="0" ${factors.minMargin==0?'selected':''}>0% trên vốn</option><option value="8" ${factors.minMargin==8?'selected':''}>8% trên vốn</option><option value="15" ${factors.minMargin==15?'selected':''}>15% trên vốn</option><option value="25" ${factors.minMargin==25?'selected':''}>25% trên vốn</option></select></div><div class="field sr-wide"><label>Mục tiêu ưu tiên</label><div class="segmented"><button data-objective="profit" class="${factors.objective==='profit'?'active':''}">Tối đa lợi nhuận</button><button data-objective="balance" class="${factors.objective==='balance'?'active':''}">Cân bằng</button><button data-objective="waste" class="${factors.objective==='waste'?'active':''}">Giảm tồn đọng</button></div></div></div><button type="button" class="btn btn-sm" id="resetScenario" style="margin-top:9px">↺ Đặt lại giả định</button><details class="rule-details" style="margin-top:16px"><summary>Công thức và giới hạn mô hình</summary><p>Dự báo bán = min(tồn kho, tốc độ bán × ngày còn bán × hệ số phản ứng giá và kênh bán).</p><p>Chênh lệch lãi/lỗ = lãi/lỗ phương án được chọn − lãi/lỗ nếu giữ giá. Đã tính giá vốn cả lô, phí xử lý tồn dự kiến và chi phí vận hành giả định.</p><p>Hệ thống chỉ xem xét phương án thỏa kiểm tra chất lượng, trần giảm giá và biên lợi nhuận tối thiểu. Đây là mô hình heuristic giả lập, không phải AI được huấn luyện trên dữ liệu doanh nghiệp.</p><p>Lưu ý nhóm hàng: ${escapeHtml(categoryOf(l).note)}</p></details></div>`:''}</section>
  <p class="sr-foot">DEMO / SIMULATED DATA — Không kết nối với hệ thống bán hàng. Lượng hàng không bán kịp là nguy cơ tồn, chưa đồng nghĩa hư hỏng. Mọi phương án cần xác nhận thực địa.</p>
 </div>`;
}
function renderInventory(){let items=lots.filter(l=>(categoryFilter==='all'||l.category===categoryFilter)&&(filter==='all'||(filter==='risk'&&riskClass(l)!=='ok')||(filter==='ok'&&riskClass(l)==='ok'))&&(`${l.id} ${l.fruit} ${categoryOf(l).name}`.toLowerCase().includes(searchTerm.toLowerCase())));document.getElementById('view-inventory').innerHTML=`${header('BATCH MANAGEMENT','Danh sách lô trái cây','Phân loại 9 nhóm từ khảo sát của m; quản lý lô, ngày nhập và đánh giá chất lượng riêng.',`<button class="btn" id="resetDemo">↺ Khôi phục dữ liệu demo</button><button class="btn" id="exportInventory">↓ Xuất CSV</button><button class="btn btn-primary" data-add-lot>＋ Nhập lô mới</button>`)}<div class="card table-card"><div class="card-head"><div><h3 class="card-title">Danh mục hàng hóa <span class="tag tag-neutral">${items.length}/${lots.length} lô</span></h3><p class="card-sub">Chọn nhóm sản phẩm để lọc. Mỗi nhóm có hệ số mô phỏng và lưu ý đánh giá riêng.</p></div></div><div class="category-filters"><button class="category-chip ${categoryFilter==='all'?'active':''}" data-category="all">Tất cả 9 nhóm</button>${CATEGORIES.map(c=>`<button class="category-chip ${categoryFilter===c.id?'active':''}" data-category="${c.id}">${c.emoji} ${c.name} <span class="tiny-count">${lots.filter(l=>l.category===c.id).length}</span></button>`).join('')}</div><div class="filterline"><div class="tabs"><button class="filter-button ${filter==='all'?'active':''}" data-filter="all">Tất cả</button><button class="filter-button ${filter==='risk'?'active':''}" data-filter="risk">Cần chú ý</button><button class="filter-button ${filter==='ok'?'active':''}" data-filter="ok">Ổn định</button></div><input id="inventorySearch" class="search" placeholder="⌕ Tìm nhóm, tên hoặc mã lô..." value="${escapeHtml(searchTerm)}" /></div>${inventoryTable(items)}</div><p class="small-note">Ngày nhập và số ngày còn bán phù hợp là hai dữ liệu khác nhau. Ngày còn bán phải dựa trên kiểm tra, không tính máy móc bằng một hạn dùng chung cho cả loại trái cây. Dữ liệu hiện tại chỉ để demo.</p>`}
function renderActions(){document.getElementById('view-actions').innerHTML=`${header('EXECUTION LOG','Phiếu xử lý','Theo dõi đề xuất đã được tạo từ Rescue Engine. Không thực hiện giao dịch hay đổi giá thật.',`<button class="btn" id="exportActions">↓ Xuất nhật ký</button><button class="btn btn-primary" data-nav="engine">＋ Đề xuất mới</button>`)}<div class="note-box"><b>Quy trình mô phỏng:</b> Chọn phương án trong Rescue Engine → tạo phiếu xử lý → quản lý kiểm tra chất lượng, năng lực thực hiện và duyệt → nhân viên đánh dấu hoàn tất. Bản demo không kết nối POS, app hay kho thực tế.</div><div class="card"><div class="card-head"><div><h3 class="card-title">Nhật ký đề xuất</h3><p class="card-sub">${actions.length} phiếu đã được tạo</p></div><span class="tag tag-neutral">LOCAL DEMO</span></div><div class="action-list">${actions.length?actions.map(a=>`<div class="action-item"><div class="fruit-emoji">${a.emoji}</div><div><h4>${escapeHtml(a.fruit)} · ${escapeHtml(a.strategy)} <span class="tag ${a.status==='Hoàn tất'?'tag-ok':'tag-risk'}">${escapeHtml(a.status)}</span></h4><p>${escapeHtml(a.id)} · ${escapeHtml(a.time)} · Dự báo bán thêm ${dNum(a.rescued)} kg · ${a.delta>=0?'+':''}${money(a.delta)} so với giữ giá</p></div>${a.status==='Chờ duyệt'?`<button class="btn btn-sm" data-complete="${a.actionId}">✓ Đánh dấu hoàn tất</button>`:'<span style="font-size:11px;color:#7dab8d">Đã ghi nhận</span>'}</div>`).join(''):'<div class="empty"><div style="font-size:34px;margin-bottom:9px">🗂</div>Chưa có phiếu nào. Vào Rescue Engine để tạo đề xuất đầu tiên.</div>'}</div></div>`}
function render(){if(!getLot()&&lots.length)selectedId=lots[0].id;document.getElementById('navRisk').textContent=totals().critical;if(view==='overview')renderOverview();else if(view==='engine')renderEngine();else if(view==='inventory')renderInventory();else renderActions();}
function openLot(id){if(!lots.some(x=>x.id===id))return;selectedId=id;selectedStrategy=null;factors.daysOverride=null;compareOpen=false;advancedOpen=false;onNav('engine')}
function toast(title,sub=''){const holder=document.getElementById('toastHolder');holder.innerHTML=`<div class="toast"><b>${escapeHtml(title)}</b>${escapeHtml(sub)}</div>`;setTimeout(()=>{holder.innerHTML=''},4200)}
function openModal(){document.getElementById('modalLayer').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><form class="modal" id="addLotForm"><div class="modal-head"><h3>Nhập lô trái cây mới</h3><button class="close" type="button" data-close-modal>×</button></div><p class="subtitle" style="margin-bottom:18px">Ghi nhóm hàng theo danh mục cửa hàng và lưu ngày nhập, độ chín, chất lượng từng lô.</p><div class="modal-grid"><div class="field"><label for="newCategory">Nhóm trái cây *</label><select id="newCategory" name="category" required>${CATEGORIES.map(c=>`<option value="${c.id}">${c.emoji} ${c.name}</option>`).join('')}</select></div><div class="field"><label for="newFruit">Tên sản phẩm cụ thể *</label><input id="newFruit" name="fruit" maxlength="60" required placeholder="Ví dụ: Quýt đường" /></div><div class="field"><label for="newReceived">Ngày nhập *</label><input id="newReceived" name="received" type="date" required value="${daysAgo(0)}" /></div><div class="field"><label for="newRipeness">Độ chín khi kiểm tra</label><select id="newRipeness" name="ripeness"><option>Không áp dụng</option><option>Xanh / cứng</option><option>Chín vừa</option><option>Chín ăn ngay</option></select></div><div class="field"><label for="newQty">Tồn kho (kg) *</label><input id="newQty" name="qty" type="number" min="0.1" step="any" required value="50" /></div><div class="field"><label for="newVelocity">Ước lượng bán (kg/ngày) *</label><input id="newVelocity" name="velocity" type="number" min="0.1" step="any" required value="12" /></div><div class="field"><label for="newDays">Số ngày còn bán phù hợp *</label><input id="newDays" name="days" type="number" min="0" max="30" step="0.5" required value="2" /></div><div class="field"><label for="newPrice">Giá bán (đ/kg) *</label><input id="newPrice" name="price" type="number" min="1000" step="1000" required value="48000" /></div><div class="field"><label for="newCost">Giá vốn (đ/kg) *</label><input id="newCost" name="cost" type="number" min="1" step="any" required value="28000" /></div><div class="field"><label for="newQuality">Tình trạng kiểm tra *</label><select id="newQuality" name="quality"><option>Đạt</option><option>Cần kiểm tra</option><option>Không đạt</option></select></div><div class="field"><label for="newTarget">Sức mua cửa hàng B *</label><select name="target" id="newTarget"><option value="1.2">1,2 lần</option><option value="1.6" selected>1,6 lần</option><option value="2.0">2,0 lần</option><option value="2.5">2,5 lần</option></select></div></div><p class="small-note">Toàn bộ dữ liệu demo lưu ngay trong trình duyệt. “Ngày còn bán phù hợp” là đánh giá thủ công, không phải hạn dùng cố định.</p><div class="modal-actions"><button class="btn" type="button" data-close-modal>Hủy</button><button class="btn btn-primary" type="submit">Thêm lô & phân tích →</button></div></form></div>`;document.getElementById('newCategory').focus()}
function closeModal(){document.getElementById('modalLayer').innerHTML=''}
function qualityModal(id){const l=lots.find(x=>x.id===id);if(!l)return;document.getElementById('modalLayer').innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><form class="modal" id="qualityForm" data-quality-id="${escapeHtml(id)}"><div class="modal-head"><h3>Kiểm định lô ${escapeHtml(id)}</h3><button class="close" type="button" data-close-modal>×</button></div><p class="subtitle" style="margin-bottom:22px">${l.emoji} ${escapeHtml(l.fruit)} · ${dNum(l.qty)} kg tồn kho. Cần có nhân viên kiểm tra thực tế trước khi xác nhận.</p><div class="field"><label for="qualitySelect">Kết quả quan sát của nhân viên</label><select id="qualitySelect"><option value="Cần kiểm tra" ${l.quality==='Cần kiểm tra'?'selected':''}>Cần kiểm tra thêm (khóa bán)</option><option value="Đạt" ${l.quality==='Đạt'?'selected':''}>Đạt yêu cầu bán hàng</option><option value="Không đạt" ${l.quality==='Không đạt'?'selected':''}>Không đạt yêu cầu (khóa bán / xử lý)</option></select></div><div class="rule-note">⚠ Đây chỉ là thao tác nhập kết quả kiểm tra. Phần mềm không thể tự xác nhận an toàn vệ sinh thực phẩm từ ngày nhập hoặc màu sắc trái cây.</div><div class="modal-actions"><button type="button" class="btn" data-close-modal>Hủy</button><button type="submit" class="btn btn-primary">Lưu kết quả</button></div></form></div>`}
function addLot(form){const fd=new FormData(form);const fruit=String(fd.get('fruit')||'').trim(),category=String(fd.get('category')||'other'),received=String(fd.get('received')||'');const qty=+fd.get('qty'),velocity=+fd.get('velocity'),days=+fd.get('days'),price=+fd.get('price'),cost=+fd.get('cost');if(!fruit||!CATEGORY_LOOKUP[category]||!/^\d{4}-\d{2}-\d{2}$/.test(received)||![qty,velocity,days,price,cost].every(Number.isFinite)||qty<=0||velocity<=0||days<0||price<=0||cost<=0){toast('Dữ liệu không hợp lệ','Kiểm tra lại các trường bắt buộc.');return}if(received>daysAgo(0)){toast('Ngày nhập không hợp lệ','Không được nhập ngày trong tương lai.');return}if(cost>price*3){toast('Cần kiểm tra giá vốn','Giá vốn quá cao so với giá bán; hãy xác nhận lại.');return}const id='FF-'+String(Math.max(311,...lots.map(l=>parseInt(l.id.split('-')[1])||311))+1);lots.unshift({id,category,fruit,emoji:CATEGORY_LOOKUP[category].emoji,received,ripeness:String(fd.get('ripeness')||'Không áp dụng'),qty,velocity,days,price,cost,quality:String(fd.get('quality')),store:'Cửa hàng demo',target:+fd.get('target'),trend:[]});save();selectedId=id;selectedStrategy=null;factors.daysOverride=null;closeModal();onNav('engine');toast('Đã thêm '+id,'Mở mô phỏng phân tích cho '+fruit)}
function createAction(){const l=getLot(),r=optimize(l,true);const selected=r.outcomes.find(o=>o.id===selectedStrategy&&o.allowed);if(!l||!selected){toast('Không thể tạo phiếu','Chọn phương án hợp lệ sau khi kiểm tra chất lượng.');return}const time=new Date().toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'});actions.unshift({actionId:'ACT-'+Date.now(),id:l.id,emoji:l.emoji,fruit:l.fruit,strategy:selected.name,rescued:selected.rescued,delta:selected.delta,status:'Chờ duyệt',time});save();toast('Đã tạo phiếu xử lý','Phiếu được đưa vào danh sách chờ duyệt (mô phỏng).');onNav('actions')}
function resetScenario(){factors={demand:100,maxDiscount:25,minMargin:8,objective:'balance',daysOverride:null};selectedStrategy=null;renderEngine()}
function csv(rows,filename){const escapeCSV=v=>'"'+String(v??'').replaceAll('"','""')+'"';const contents='\ufeff'+rows.map(r=>r.map(escapeCSV).join(',')).join('\r\n');const blob=new Blob([contents],{type:'text/csv;charset=utf-8;'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},100)}
function exportFile(actionsOnly=false){if(actionsOnly){csv([['Mã phiếu','Mã lô','Trái cây','Phương án','Cứu thêm (kg)','Chênh lệch lãi/lỗ (VND)','Trạng thái','Ngày tạo'],...actions.map(a=>[a.actionId,a.id,a.fruit,a.strategy,a.rescued,a.delta,a.status,a.time])],'freshflow_nhat_ky_xu_ly.csv');toast('Đã xuất CSV','Nhật ký phiếu xử lý giả lập.');return}csv([['Mã lô','Nhóm hàng','Trái cây','Ngày nhập','Độ chín','Tồn (kg)','Bán/ngày (kg)','Ngày còn bán phù hợp','Giá bán VND/kg','Giá vốn VND/kg','Chất lượng','Dư dự báo nếu giữ giá (kg)','Phương án gợi ý','Lượng bán thêm dự báo (kg)','Chênh lệch lãi/lỗ (VND)'],...lots.map(l=>{let r=optimize(l);return [l.id,categoryOf(l).name,l.fruit,l.received||'',l.ripeness||'',l.qty,l.velocity,l.days,l.price,l.cost,l.quality,Math.round(r.base.waste*10)/10,r.best?.name||'Chờ kiểm tra',Math.round((r.best?.rescued||0)*10)/10,Math.round(r.best?.delta||0)]})],'freshflow_bao_cao_lo_trai_cay.csv');toast('Đã xuất báo cáo CSV','Mở bằng Excel để xem dữ liệu mô phỏng.');}
// Event delegation: all view re-renders remain interactive.
document.addEventListener('click',e=>{
 const nav=e.target.closest('[data-nav]');if(nav){onNav(nav.dataset.nav);return}
 const menu=e.target.closest('#mobileMenu');if(menu){document.getElementById('sidebar').classList.toggle('open');return}
 const navBtn=e.target.closest('.nav-btn[data-view]');if(navBtn){onNav(navBtn.dataset.view);return}
 const verify=e.target.closest('[data-verify-lot]');if(verify){qualityModal(verify.dataset.verifyLot);return}
 const open=e.target.closest('[data-open-lot]');if(open){openLot(open.dataset.openLot);return}
 const strategy=e.target.closest('[data-strategy]');if(strategy){selectedStrategy=strategy.dataset.strategy;compareOpen=true;renderEngine();return}
 if(e.target.closest('[data-toggle-compare]')){compareOpen=!compareOpen;renderEngine();return}
 if(e.target.closest('[data-toggle-advanced]')){advancedOpen=!advancedOpen;renderEngine();return}
 const objective=e.target.closest('[data-objective]');if(objective){factors.objective=objective.dataset.objective;selectedStrategy=null;renderEngine();return}
 const catNav=e.target.closest('[data-category-nav]');if(catNav){categoryFilter=catNav.dataset.categoryNav;filter='all';searchTerm='';onNav('inventory');return}
 const catFilter=e.target.closest('[data-category]');if(catFilter){categoryFilter=catFilter.dataset.category;renderInventory();return}
 const filt=e.target.closest('[data-filter]');if(filt){filter=filt.dataset.filter;renderInventory();return}
 if(e.target.closest('[data-add-lot]')){openModal();return}
 if(e.target.closest('[data-close-modal]')||e.target.id==='modalBackdrop'){closeModal();return}
 if(e.target.closest('#resetScenario')){resetScenario();return}
 if(e.target.closest('#resetDemo')){if(confirm('Khôi phục dữ liệu minh họa 9 nhóm trái cây? Các phiếu và lô đã tự thêm trong bản demo sẽ mất.')){lots=clone(SEED);actions=[];selectedId='FF-305';categoryFilter='all';filter='all';searchTerm='';save();render();toast('Đã khôi phục dữ liệu mẫu','11 lô thuộc đủ 9 nhóm trái cây.')}return}
 if(e.target.closest('#applyStrategy')){createAction();return}
 if(e.target.closest('#exportDashboard')||e.target.closest('#exportEngine')||e.target.closest('#exportInventory')){exportFile();return}
 if(e.target.closest('#exportActions')){exportFile(true);return}
 const done=e.target.closest('[data-complete]');if(done){const a=actions.find(x=>x.actionId===done.dataset.complete);if(a){a.status='Hoàn tất';save();renderActions();toast('Đã cập nhật phiếu','Đã đánh dấu hoàn tất trong bản demo.')}return}
});
document.addEventListener('input',e=>{if(e.target.id==='demandSlider'){factors.demand=+e.target.value;document.getElementById('demandOutput').textContent=factors.demand+'%'}if(e.target.id==='daysSlider'){factors.daysOverride=+e.target.value;document.getElementById('daysOutput').textContent=dNum(factors.daysOverride)+' ngày'}if(e.target.id==='inventorySearch'){const cursor=e.target.selectionStart;searchTerm=e.target.value;renderInventory();const s=document.getElementById('inventorySearch');s.focus();s.setSelectionRange(cursor,cursor)}});
document.addEventListener('change',e=>{if(e.target.id==='demandSlider'||e.target.id==='daysSlider'){selectedStrategy=null;renderEngine();return}if(e.target.id==='lotSelector'){selectedId=e.target.value;factors.daysOverride=null;selectedStrategy=null;renderEngine()}if(e.target.id==='discountLimit'){factors.maxDiscount=+e.target.value;selectedStrategy=null;renderEngine()}if(e.target.id==='marginLimit'){factors.minMargin=+e.target.value;selectedStrategy=null;renderEngine()}});
document.addEventListener('submit',e=>{if(e.target.id==='addLotForm'){e.preventDefault();addLot(e.target)}if(e.target.id==='qualityForm'){e.preventDefault();const l=lots.find(x=>x.id===e.target.dataset.qualityId);if(l){l.quality=document.getElementById('qualitySelect').value;save();closeModal();render();toast('Đã cập nhật chất lượng',l.quality==='Đạt'?'Lô đủ điều kiện để phân tích phương án bán.':'Hệ thống sẽ không đề xuất bán lô này.')}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});
render();
})();
</script>
</body>
</html>
